name: Распаковать arena-fire.zip

on:
  push:
    paths:
      - 'arena-fire.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить архив
        run: |
          test -f arena-fire.zip || { echo "В репозитории нет arena-fire.zip"; exit 1; }

      - name: Распаковать и заменить файлы
        run: |
          rm -rf /tmp/unpacked
          mkdir /tmp/unpacked
          unzip -o -q arena-fire.zip -d /tmp/unpacked
          SRC=/tmp/unpacked
          if [ -d /tmp/unpacked/arena-fire ]; then SRC=/tmp/unpacked/arena-fire; fi
          test -f "$SRC/server.js" || { echo "В архиве нет server.js"; exit 1; }
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'arena-fire.zip' \
            "$SRC"/ ./

      - name: Убрать архив и сохранить изменения
        run: |
          git rm -q --cached arena-fire.zip || true
          rm -f arena-fire.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновление игры из arena-fire.zip"
            git push
          fi
