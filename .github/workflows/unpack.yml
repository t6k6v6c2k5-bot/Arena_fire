name: Unpack zip
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          set -e
          for z in *.zip; do
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            n=$(ls -A "$tmp" | wc -l)
            if [ "$n" -eq 1 ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then
              src="$tmp/$(ls -A "$tmp")"
            else
              src="$tmp"
            fi
            cp -a "$src"/. .
            rm -f "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack archive" || exit 0
          git push
