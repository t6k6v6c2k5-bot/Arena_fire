<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arena Fire">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Вход — Arena Fire</title>
<meta name="description" content="Вход и регистрация в Arena Fire">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Tektur:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main><div class="auth card">
  <div class="tabs" id="tabs"><button data-m="login">Вход</button><button data-m="register">Регистрация</button></div>
  <form id="f" novalidate>
    <label class="f" id="rNick">Позывной<input name="nick" maxlength="16" autocomplete="username" placeholder="Например, Viking"></label>
    <label class="f" id="lLogin">Email или позывной<input name="login" autocomplete="username" autocapitalize="none"></label>
    <label class="f" id="rEmail">Email<input name="email" type="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com"></label>
    <label class="f">Пароль<input name="password" type="password" autocomplete="current-password" minlength="8"></label>
    <div class="err" id="err"></div>
    <button class="btn full big" id="go" type="submit">Войти</button>
  </form>
  <p class="muted small center" style="margin-top:14px" id="note"></p>
  <p class="center" style="margin-top:6px"><a href="/play">Играть как гость</a></p>
</div></main>
<script type="module">
import { boot, api, esc, fmt, toast, tagHtml, lvlHtml, kd, pct, nextUrl, getMe, $, $$ } from '/site.js';

const u = await boot('');
if (u) location.replace(nextUrl());
let mode = location.pathname === '/register' ? 'register' : 'login';
const f = $('#f');
function setMode(m) {
  mode = m;
  history.replaceState(null, '', '/' + m + location.search);
  document.title = (m === 'login' ? 'Вход' : 'Регистрация') + ' — Arena Fire';
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  $('#rNick').classList.toggle('hidden', m !== 'register'); $('#rEmail').classList.toggle('hidden', m !== 'register');
  $('#lLogin').classList.toggle('hidden', m !== 'login');
  f.password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#go').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
  $('#note').textContent = m === 'register' ? 'Пароль от 8 символов. Позывной: 3–16 символов, буквы, цифры, _ и -. Стартовый бонус — 200 монет.' : '';
  $('#err').textContent = '';
}
$$('#tabs button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));
setMode(mode);
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  $('#err').textContent = ''; $('#go').disabled = true;
  try {
    await api(mode === 'login' ? '/login' : '/register', mode === 'login' ? { login: v.login, password: v.password } : { email: v.email, nick: v.nick, password: v.password });
    location.replace(nextUrl());
  } catch (x) { $('#err').textContent = x.message; $('#go').disabled = false; }
});
</script>
</body>
</html>
